name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  development-foundation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm --prefix src/sharing ci
      - run: npm --prefix tools/docs ci
      - run: npm run security:install
      - run: npm run verify:all
