<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDE · 작업 공간</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body>

<div class="mobile-tabs"><button data-mobile="model" aria-pressed="true">모델</button><button data-mobile="input" aria-pressed="false">대화</button></div>
<div class="app-shell"><nav class="rail" aria-label="작업 공간 탐색"><strong class="rail-brand">V.</strong><button data-section="document-tree" title="작업 문서" aria-label="작업 문서" data-icon="layers"></button><button data-section="task-list" title="작업 이력" aria-label="작업 이력" data-icon="history"></button><button data-section="reference-list" title="참고 자료" aria-label="참고 자료" data-icon="file"></button></nav><main><aside id="left"><div class="project-heading"><strong class="brand">V<span>.</span></strong><select id="project-picker" aria-label="프로젝트"></select><button id="new-project" title="새 프로젝트" aria-label="새 프로젝트">＋</button><strong id="project-name" hidden>프로젝트</strong></div><select id="host-target" aria-label="작업 호스트"><option value="rhino">Rhino · 3D</option><option value="zwcad">ZWCAD · 도면</option></select><details class="nav-section"><summary>열린 Rhino 문서</summary><button id="refresh-documents">문서 조회</button><select id="host-documents" aria-label="열린 Rhino 문서" hidden></select><small id="host-document-info">조회한 문서를 표시합니다.</small><button id="capture-document" disabled>작업 사본 가져오기</button><button id="inspect-selection" disabled>호스트 선택 확인</button></details><div class="document-heading"><p class="caption">작업 문서</p><button id="import-model" title="Rhino 파일 불러오기">＋</button><input id="model-file" type="file" accept=".3dm" hidden></div><details class="document" id="document-tree"><summary>작업 모델</summary><small id="document-host">Rhino</small><details id="object-tree"><summary>객체</summary><div id="objects"></div></details></details><details class="nav-section"><summary>작업</summary><div id="task-list"><small>아직 요청이 없습니다.</small></div></details><details class="nav-section"><summary>참고 자료</summary><div id="reference-list"><small>첨부한 파일이 없습니다.</small></div></details><p class="preview-info" id="connection-status">연결 확인 중</p></aside>
<section class="workspace"><div class="viewport-area"><button class="edge-toggle edge-left" id="toggle-left" aria-label="문서 패널 접기/펼치기" aria-expanded="true" title="문서 · Alt+Shift+L">‹</button><button class="edge-toggle edge-right" id="toggle-right" aria-label="대화 패널 접기/펼치기" aria-expanded="true" title="대화 · Alt+Shift+R">›</button><div class="spatial-tools" aria-label="공간 입력"><button data-tool="select" aria-label="선택" title="선택" aria-pressed="true" data-icon="cursor"></button><button data-tool="pin" aria-label="핀 첨부" title="객체를 눌러 요청에 첨부" data-icon="pin"></button><button data-tool="sketch" aria-label="스케치" title="평면에 스케치" data-icon="pencil"></button></div>
<div class="view-navigation"><button data-view="axon" title="3D 원근" aria-label="3D 원근" data-icon="cube"></button><button data-view="plan" title="위 · 직교" aria-label="위 · 직교">T</button><button data-view="front" title="앞 · 직교" aria-label="앞 · 직교">F</button><button data-view="side" title="옆 · 직교" aria-label="옆 · 직교">R</button><button data-projection="orthographic" title="직교 투영" aria-label="직교 투영">O</button><button data-projection="perspective" title="원근 투영" aria-label="원근 투영">P</button><button id="fit-selection" title="선택 객체 보기" aria-label="선택 객체 보기">⌖</button><select hidden id="projection" aria-label="투영"><option value="axon">3D</option><option value="plan">위</option><option value="front">앞</option><option value="side">옆</option></select><button id="fit-view" title="모델 전체 보기">⊡</button></div>
<div id="sketch-tools" hidden><select id="plane" aria-label="작업 평면"><option>XY</option><option>XZ</option><option>YZ</option></select><select id="line-role" aria-label="선 역할"><option value="reference">참고</option><option value="boundary">경계</option><option value="path">경로</option><option value="direction">방향</option></select><button id="undo-point" title="마지막 점 지우기">↶</button><button id="finish-sketch">입력에 첨부</button><button id="cancel-sketch">취소</button><span>평면 원점 0 · m</span><div class="coordinate-entry"><input id="point-u" type="number" step="any" placeholder="U (m)" aria-label="평면 U 좌표"><input id="point-v" type="number" step="any" placeholder="V (m)" aria-label="평면 V 좌표"><button id="add-point">점 추가</button></div><div id="sketch-points" aria-label="스케치 좌표"></div></div>
<div id="canvas"></div><p id="tool-hint"></p></div><section id="inspector" aria-label="객체 속성"><div id="inspector-resize" role="separator" aria-label="객체 속성 높이" aria-orientation="horizontal" aria-valuemin="120" aria-valuemax="480" aria-valuenow="182" tabindex="0"></div><div class="inspector-head"><strong id="selection">객체 속성</strong><span id="selection-kind"></span><button id="selection-pin" hidden title="선택한 객체를 대화에 첨부">요청에 첨부</button><button id="inspector-toggle" aria-label="객체 속성 접기/펼치기" aria-expanded="true">⌄</button></div><div class="inspector-body"><nav aria-label="객체 정보"><button data-inspect="properties" aria-pressed="true">속성</button><button data-inspect="geometry">형상</button><button data-inspect="history">이력</button></nav><div id="inspector-content">객체를 선택하세요.</div></div></section></section>
<aside id="right"><div class="chat-heading"><h2>AI WORK</h2><details id="draft-menu"><summary aria-label="초안 메뉴">···</summary><button id="save">초안 저장</button><button id="load">불러오기</button></details></div><section class="request-section"><h3>REQUESTS <span id="request-count">0</span></h3><div id="pending-requests"></div></section><section class="active-section"><h3>ACTIVE WORK</h3><div id="active-work">진행 중인 작업 없음</div></section><h3 class="recent-heading">RECENT</h3><div id="conversation" aria-label="대화" aria-live="polite"><div class="chat-empty">V<span>.</span></div></div>
<div class="composer-wrap"><div class="composer"><div id="context" aria-label="첨부한 문맥"></div><label class="sr-only" for="body">메시지</label><textarea id="body" rows="3" placeholder="요청을 적거나, 객체와 스케치를 첨부하세요…"></textarea><div class="compose-actions"><details id="attach-menu"><summary aria-label="참조 추가" title="참조 추가">＋</summary><div class="menu"><button id="pin">선택한 객체 첨부</button><button id="draw">스케치 그리기</button><button id="attach-file">파일 첨부</button></div></details><input id="files" type="file" multiple hidden><button id="add-request" title="메시지를 요청 목록에 추가">＋ 요청</button><span id="saved"></span><button id="request" class="send" aria-label="메시지 보내기" title="요청 묶음 실행 · Ctrl+Enter">↑</button></div></div>
<div class="composer-settings"><select id="permission" aria-label="Permission" title="Permission"><option value="review">검토만</option><option value="candidate">후보 작업 허용</option></select><select id="model" aria-label="모델" title="AI 공급자"></select><select id="effort" aria-label="Effort" title="Effort"></select></div><p id="validation" role="status"></p>
</div></aside></main></div><footer class="statusbar"><span id="workspace-status">작업 공간 연결 중</span><span id="work-count"></span><span>작업 사본</span></footer><div id="message" class="toast" role="status" hidden></div>
</body></html>
