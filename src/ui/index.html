<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDE · 작업 공간</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script type="module" src="/main.tsx"></script></head>
<body>

<div class="mobile-tabs" id="mobile-navigation"></div>
<div class="app-shell"><nav class="rail" aria-label="작업 공간 탐색"><button data-section="document-tree" title="작업 문서" aria-label="작업 문서" data-icon="layers"></button><button data-section="task-list" title="작업 이력" aria-label="작업 이력" data-icon="history"></button><button data-section="reference-list" title="참고 자료" aria-label="참고 자료" data-icon="file"></button><button id="extensions" title="확장" aria-label="확장" data-icon="extension"></button><button id="workspace-settings" class="rail-settings" title="설정" aria-label="설정">⚙</button></nav><main><aside id="left"><div class="project-heading" id="project-heading"></div><section class="connection-card" id="connection-card" aria-label="모델 연결"><div class="card-head"><p class="caption">모델 연결 · Rhino / ZWCAD</p><select id="host-target" class="visually-hidden" aria-label="작업 호스트"><option value="rhino">Rhino · 3D</option><option value="zwcad">ZWCAD · 도면</option></select></div><div id="host-document-controls"></div><button id="import-model" class="link-button" title="열린 호스트 대신 3DM·DWG 파일을 작업 사본으로 엽니다">파일에서 열기 · 3DM/DWG</button><input id="model-file" type="file" accept=".3dm,.dwg" hidden></section><details class="nav-section model-tree" id="document-tree" open><summary>모델 구조 <small id="document-host">Rhino</small></summary><div id="objects"></div></details><details class="nav-section"><summary>작업 이력</summary><div id="task-list"><small>아직 요청이 없습니다.</small></div></details><details class="nav-section"><summary>검토본</summary><div id="review-list"></div></details><details class="nav-section"><summary>참고 자료</summary><div id="reference-list"><small>첨부한 파일이 없습니다.</small></div></details><p class="preview-info" id="connection-status">연결 확인 중</p><p class="preview-info" id="host-status"></p><p class="preview-info" id="auth-status" role="status" hidden></p></aside>
<section class="workspace"><div class="viewport-area"><button class="edge-toggle edge-left" id="toggle-left" aria-label="문서 패널 접기/펼치기" aria-expanded="true" title="문서 · Alt+Shift+L">‹</button><button class="edge-toggle edge-right" id="toggle-right" aria-label="대화 패널 접기/펼치기" aria-expanded="true" title="대화 · Alt+Shift+R">›</button><div class="spatial-tools" aria-label="공간 입력"><button data-tool="select" aria-label="선택" title="선택" aria-pressed="true" data-icon="cursor"></button><button data-tool="sketch" aria-label="스케치" title="브러시 스케치 · 표면·화면·평면에 자유롭게 그리기" data-icon="pencil"></button></div>
<div class="view-navigation"><button data-view="axon" title="3D 원근" aria-label="3D 원근" data-icon="cube"></button><button data-view="plan" title="위 · 직교" aria-label="위 · 직교">위</button><button data-view="front" title="앞 · 직교" aria-label="앞 · 직교">앞</button><button data-view="side" title="옆 · 직교" aria-label="옆 · 직교">옆</button><button id="projection-toggle" title="투영 전환" aria-label="직교 투영으로 전환">원근</button><button id="fit-selection" title="선택 객체 보기" aria-label="선택 객체 보기">⌖</button><select hidden id="projection" aria-label="투영"><option value="axon">3D</option><option value="plan">위</option><option value="front">앞</option><option value="side">옆</option></select><button id="fit-view" title="모델 전체 보기">⊡</button><button id="display-settings" title="뷰포트 표시 · 음영·색상·모서리" aria-label="뷰포트 표시 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button></div>
<div id="sketch-tools" hidden><div class="brush-row"><div class="swatches" role="group" aria-label="브러시 색상"><button type="button" class="swatch" data-color="#d0473a" style="--swatch:#d0473a" aria-label="색상 #d0473a" title="#d0473a"></button><button type="button" class="swatch" data-color="#e8913a" style="--swatch:#e8913a" aria-label="색상 #e8913a" title="#e8913a"></button><button type="button" class="swatch" data-color="#e3c63c" style="--swatch:#e3c63c" aria-label="색상 #e3c63c" title="#e3c63c"></button><button type="button" class="swatch" data-color="#3f9b5c" style="--swatch:#3f9b5c" aria-label="색상 #3f9b5c" title="#3f9b5c"></button><button type="button" class="swatch" data-color="#3c6fd0" style="--swatch:#3c6fd0" aria-label="색상 #3c6fd0" title="#3c6fd0"></button><button type="button" class="swatch" data-color="#7a4fc0" style="--swatch:#7a4fc0" aria-label="색상 #7a4fc0" title="#7a4fc0"></button><button type="button" class="swatch" data-color="#292c2d" style="--swatch:#292c2d" aria-label="색상 #292c2d" title="#292c2d"></button><input id="brush-color" type="color" value="#d0473a" aria-label="브러시 색상 직접 선택" title="색상 직접 선택"></div><label class="brush-width" title="브러시 굵기 · [ ]">굵기<input id="brush-width" type="range" min="1" max="24" step="1" value="4" aria-label="브러시 굵기"><output id="brush-width-value">4</output></label><button type="button" id="brush-eraser" aria-pressed="false" title="지우개 · 획 전체를 지웁니다 (E)">지우개</button><span class="tool-sep"></span><select id="placement" aria-label="그리기 위치" title="그리기 위치: 표면=모델 위, 화면=현재 시점 평면, 평면=축 평면"><option value="surface">표면에 그리기</option><option value="view">화면 평면</option><option value="plane">축 평면</option></select><select id="plane" aria-label="작업 평면"><option>XY</option><option>XZ</option><option>YZ</option></select><input id="plane-offset" type="number" step="any" value="0" aria-label="평면 오프셋 (m)" title="평면 오프셋 (m)"><select id="line-role" aria-label="선 역할"><option value="reference">참고</option><option value="boundary">경계</option><option value="path">경로</option><option value="direction">방향</option></select><span class="tool-sep"></span><button type="button" id="undo-point" title="마지막 획 지우기 · Ctrl+Z">↶</button><button type="button" id="clear-sketch" title="그린 획 모두 지우기">비우기</button><button type="button" id="finish-sketch" class="primary-button">입력에 첨부</button><button type="button" id="cancel-sketch">취소</button></div><details id="sketch-coordinates"><summary>좌표로 입력</summary><span>선택한 평면 · 원점 0 · m</span><div class="coordinate-entry"><input id="point-u" type="number" step="any" placeholder="U (m)" aria-label="평면 U 좌표"><input id="point-v" type="number" step="any" placeholder="V (m)" aria-label="평면 V 좌표"><button id="add-point">점 추가</button></div><div id="sketch-points" aria-label="스케치 좌표"></div></details></div>
<div class="selection-bar" id="selection-bar" hidden><span id="selection-count"></span><button id="selection-pin" title="선택한 객체를 요청의 변경 대상으로 고정합니다. 연결된 Rhino에도 같이 표시됩니다.">📌 요청에 고정</button></div><div id="canvas"></div><p id="tool-hint"></p></div><section id="inspector" aria-label="객체 속성"><div id="inspector-resize" role="separator" aria-label="객체 속성 높이" aria-orientation="horizontal" aria-valuemin="120" aria-valuemax="480" aria-valuenow="182" tabindex="0"></div><div class="inspector-head" title="객체 속성 열기/닫기"><button id="inspector-toggle" aria-label="객체 속성 접기/펼치기" aria-expanded="false"></button><strong id="selection">객체 속성</strong><span id="selection-kind"></span></div><div class="inspector-body"><nav aria-label="객체 정보"><button data-inspect="properties" aria-pressed="true">속성</button><button data-inspect="geometry">형상</button><button data-inspect="relations">관계</button><button data-inspect="history">이력</button></nav><div id="inspector-content">객체를 선택하세요.</div></div></section></section>
<aside id="right"><div class="panel-header" id="panel-header" hidden><div class="panel-title"><strong id="panel-doc">Rhino</strong><small id="panel-state">연결 확인 중</small></div><button id="panel-pin" title="Rhino에서 선택한 객체를 요청 대상으로 고정">📌 선택 고정</button><button id="panel-sync" class="primary-button" title="현재 Rhino 모델을 VIDE 기준으로 가져옵니다">Sync</button></div><div class="chat-heading"><h2>AI WORK</h2></div><section class="thread-section" id="recent-section" data-open="true"><div class="recent-heading"><span class="thread-title">대화 <span id="recent-count"></span></span><button id="toggle-recent" type="button" hidden aria-expanded="true"></button><button id="expand-history" type="button" title="모든 작업 카드 펼치기/접기">모두 펼치기</button></div><div id="thread"><div id="conversation" aria-label="대화" aria-live="polite"><div class="chat-empty">요청을 보내면 대화가 여기에 표시됩니다.</div></div><div id="active-work" class="thread-live" aria-live="polite"></div><div class="thread-queue" id="thread-queue"><div class="queue-head">대기 중인 요청 <span id="request-count">0</span> · 보내기를 누르면 함께 실행</div><div id="pending-requests"></div></div></div></section>
<div class="composer-wrap"><div id="composer-resize" role="separator" aria-label="메시지 입력 높이" aria-orientation="horizontal" tabindex="0"></div><div class="composer"><div id="context" aria-label="첨부한 문맥"></div><label class="sr-only" for="body">메시지</label><textarea id="body" disabled rows="3" placeholder="요청을 적거나, 객체와 스케치를 첨부하세요…"></textarea><div class="compose-actions"><details id="attach-menu"><summary aria-label="참조 추가" title="객체·스케치·파일 첨부" data-icon="paperclip"></summary><div class="menu"><button id="pin">뷰포트 선택 객체 첨부</button><button id="inspect-selection">Rhino에서 선택한 객체 첨부</button><button id="draw">스케치 그리기</button><button id="attach-file" title="파일당 50,000바이트 이하">TXT · MD · CSV · JSON 첨부</button><button id="linked-targets">연계 대상</button><small id="linked-hint"></small></div></details><input id="files" type="file" accept=".txt,.md,.csv,.json" multiple hidden><span id="saved"></span><button id="add-request" class="queue" aria-label="요청 목록에 추가" title="요청 목록에 추가 · Shift+Enter" data-icon="list-plus"></button><button id="request" class="send" aria-label="메시지 보내기" title="보내기 · Ctrl+Enter" data-icon="send"></button></div></div>
<div class="composer-settings"><select id="permission" class="mode-select" aria-label="작업 모드" title="작업 모드 · Shift+Tab으로 전환"><option value="review" title="AI가 모델을 읽고 답변·계획만 합니다. 모델은 바꾸지 않습니다.">⏸ Plan mode</option><option value="candidate" title="AI가 작업 사본에서 수정합니다. 결과를 확인한 뒤 문서에 적용을 눌러 반영합니다.">✓ Accept edits</option><option value="apply" title="AI의 검증된 수정을 연결된 Rhino 문서에 바로 반영합니다.">⏵⏵ Auto mode</option></select><select id="model" aria-label="모델" title="설치 CLI 자료와 공식 지원 모델 목록입니다. 실제 계정 사용 가능 여부는 실행 시 확인됩니다."></select><details class="effort-control" id="effort-menu"><summary title="추론 강도"><span aria-hidden="true">◷</span> <span id="effort-label">기본값</span></summary><div class="effort-popover"><strong>추론 강도</strong><input id="effort" type="range" min="0" max="0" step="1" value="0" aria-label="Effort"><div id="effort-steps"></div></div></details></div><p id="validation" role="status"></p>
</div></aside></main></div><footer class="statusbar"><span id="workspace-status">작업 공간 연결 중</span><span id="work-count"></span><span>작업 사본</span></footer><div id="message" class="toast" role="status" hidden></div>
