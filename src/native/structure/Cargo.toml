[package]
name = "vide-structure"
version = "0.1.0"
edition = "2021"
description = "VIDE structure analysis core: 3D frame analysis and KDS steel member checks"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vide-structure-cli"
path = "src/bin/vide-structure.rs"

[features]
default = ["node"]
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
faer = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
