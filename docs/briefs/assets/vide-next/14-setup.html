<script src="app.js"></script>
<script>
/* 14: 계정 칩(있음/없음) → 그 제공자 행 켜고 끔(tr.off = —) · [로그인 ›] → AccountSwitch에서 로그인한 꼴(✓ · 계정 1, 됨, AccountSwitch 계정 +1) */
(function () {
  var tb = document.querySelector('.setup .tbl tbody');
  document.querySelector('.acct').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-acct]'); if (!b) return;
    var on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); b.classList.toggle('on', on);
    tb.querySelector('tr[data-acct="' + b.dataset.acct + '"]').classList.toggle('off', !on);
  });
  tb.addEventListener('click', function (e) {
    var b = e.target.closest('[data-login]'); if (!b) return; var tr = b.closest('tr'), n = tb.querySelector('.n-acct b');
    b.parentNode.innerHTML = '<span><span class="ok-g">✓</span> · <bdi data-en="Account" data-ko="계정">계정</bdi> 1</span>';
    var st = tr.querySelector('.st'); st.classList.add('ok'); st.setAttribute('data-en', 'Ready'); st.setAttribute('data-ko', '됨');
    st.textContent = document.documentElement.lang === 'en' ? 'Ready' : '됨';
    n.textContent = String(+n.textContent + 1);
    if (document.documentElement.lang === 'en') tr.querySelector('bdi').textContent = 'Account';
  });
})();
</script>
