<script src="app.js"></script>
<script>
/* 14: 카드를 누르면 단추 없이 그 자리에서 처리 — ⟳ 확인 → (없으면) ⟳ 설치 → ✓ 설치. AccountSwitch는 ⟳ 설치 → ⟳ 로그인(브라우저) → ✓ 로그인 · 계정 n. 다시 누르면 끔 */
(function () {
  var en = function () { return document.documentElement.lang === 'en'; };
  var T = { chk: ['확인', 'Checking'], inst: ['설치', 'Installing'], done: ['설치', 'Installed'], login: ['로그인', 'Sign in'], acct: ['계정', 'Account'], ok: ['로그인', 'Signed in'] };
  var w = function (k) { return '<bdi data-ko="' + T[k][0] + '" data-en="' + T[k][1] + '">' + (en() ? T[k][1] : T[k][0]) + '</bdi>'; };
  var run = function (act, steps) {
    var i = 0, tick = function () {
      if (act.hidden) return;
      var st = steps[i++];
      if (!st) return;
      if (st[0] === 'ok') act.innerHTML = '<span class="ok">✓ ' + st[1] + '</span>';
      else { act.innerHTML = '<span class="busy"><span class="spin">⟳</span> ' + st[1] + '</span>'; setTimeout(tick, st[2] || 700); }
    };
    tick();
  };
  document.querySelector('.bigcards').addEventListener('click', function (e) {
    var card = e.target.closest('.bigcard'); if (!card) return;
    var act = card.querySelector('.act');
    var on = card.getAttribute('aria-pressed') !== 'true';
    card.setAttribute('aria-pressed', String(on)); act.hidden = !on;
    if (!on) { act.innerHTML = ''; return; }
    if (card.dataset.have) { act.innerHTML = '<span class="ok">✓ ' + w('done') + '</span>'; return; }
    if (card.dataset.acct === 'acs') {
      var n = document.querySelectorAll('.bigcard[data-acct="claude"][aria-pressed="true"],.bigcard[data-acct="gpt"][aria-pressed="true"]').length;
      run(act, [['busy', w('inst'), 900], ['busy', w('login'), 900], ['ok', w('ok') + ' · ' + w('acct') + ' <span class="n">' + n + '</span>']]);
    } else run(act, [['busy', w('chk'), 600], ['busy', w('inst'), 900], ['ok', w('done')]]);
  });
})();
</script>
