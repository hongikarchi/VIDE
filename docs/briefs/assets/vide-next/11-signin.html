<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="VIDE — Sign in">VIDE — 로그인</title>
<!-- VIDE Next 목업 v9 · 11 로그인|가입(설치본 첫 실행의 첫 장, src/ui/first-run.tsx 라벨: 아이디 · 비밀번호 · PC 이름). 카드 머리 .seg 토글, 가입 = 아이디 · 비밀번호 · 가입 코드(서버 SIGNUP_CODE 관문) · PC 이름(로그인과 같음, 비우면 VIDE PC — first-run.tsx:118). AccountSwitch는 14 설정 ①로 옮김. [로그인]/[가입] → 14-setup.html. .app 격자 없음. 입력값 비움. 설명 문장 없음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* 장별: 배치만 */
.corner{position:fixed;top:12px;right:12px;display:flex;gap:4px;z-index:3}
.corner button{font-size:11px;color:var(--mute);height:24px;min-width:24px;padding:0 6px;border-radius:3px;display:inline-grid;place-items:center}
.corner button:hover{background:var(--panel);color:var(--fg)}
.corner .moon{display:none}
[data-theme=dark] .corner .sun{display:none}
[data-theme=dark] .corner .moon{display:block}
.signin .head{display:flex;align-items:center;gap:12px}
.signin .head .seg{flex:1}
.signin [hidden]{display:none!important}
</style>
</head>
<body class="site">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-lang-ko" viewBox="0 0 24 24"><text x="12" y="17.5" text-anchor="middle" font-family="IBM Plex Sans KR, IBM Plex Sans, sans-serif" font-size="15" font-weight="500" fill="currentColor" stroke="none">가</text></symbol>
  <symbol id="i-lang-en" viewBox="0 0 24 24"><text x="12" y="17.5" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="500" fill="currentColor" stroke="none">A</text></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
</svg>

<div class="corner">
  <button type="button" data-lang-toggle aria-pressed="false" title="언어 · EN" data-en-title="Language · 한" aria-label="언어" data-en-label="Language"><svg class="i xs ko"><use href="#i-lang-ko"/></svg><svg class="i xs en"><use href="#i-lang-en"/></svg></button>
  <button type="button" data-theme-toggle title="밝게 / 어둡게" data-en-title="Light / Dark"><svg class="i xs sun"><use href="#i-sun"/></svg><svg class="i xs moon"><use href="#i-moon"/></svg></button>
</div>

<main class="signin">
  <form class="card" action="14-setup.html" method="get" aria-label="로그인" data-en-label="Sign in">
    <div class="head"><span class="mark">VIDE</span>
      <div class="seg" role="group"><button type="button" class="on" aria-pressed="true" data-mode="in" data-en="Sign in">로그인</button><button type="button" aria-pressed="false" data-mode="up" data-en="Sign up">가입</button></div>
    </div>
    <label><span data-en="ID">아이디</span><input type="text" name="id" autocomplete="username" spellcheck="false"></label>
    <label><span data-en="Password">비밀번호</span><input type="password" name="password" autocomplete="current-password"></label>
    <label data-only="up" hidden><span data-en="Sign-up code">가입 코드</span><input type="text" name="code" autocomplete="off" spellcheck="false"></label>
    <label><span data-en="PC name">PC 이름</span><input type="text" name="pc" spellcheck="false" placeholder="VIDE PC" data-en-ph="VIDE PC"></label>
    <a class="btn primary" href="14-setup.html" data-only="in" data-en="Sign in">로그인</a>
    <a class="btn primary" href="14-setup.html" data-only="up" data-en="Sign up" hidden>가입</a>
    <div class="links" data-only="in"><a href="#" data-en="Reset">비밀번호 찾기</a></div>
  </form>
</main>

<nav class="demo-nav" aria-label="데모 넘기기"><a class="prev off" href="#" title="이전">‹</a><b>1 / 16</b><a class="next" href="14-setup.html" title="다음">›</a></nav>
<script src="app.js"></script>
<script>
/* 11: 로그인 | 가입 토글(.seg) — 가입이면 가입 코드 칸 추가(PC 이름은 둘 다: 가입 직후 /remote/link name, 비우면 VIDE PC), 단추 글자 바뀜 */
(function () {
  var f = document.querySelector('.signin form'), pw = f.querySelector('input[name=password]');
  f.querySelector('.seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]'); if (!b) return; var m = b.dataset.mode;
    [].forEach.call(this.querySelectorAll('button'), function (x) { var on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); });
    [].forEach.call(f.querySelectorAll('[data-only]'), function (x) { x.hidden = x.dataset.only !== m; });
    pw.autocomplete = m === 'up' ? 'new-password' : 'current-password';
  });
})();
</script>
</body>
</html>
