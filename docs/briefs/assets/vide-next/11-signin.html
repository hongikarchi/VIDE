<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="VIDE — Sign in">VIDE — 로그인</title>
<!-- VIDE Next 목업 v7 · 11 로그인(설치본 첫 실행의 첫 장, src/ui/first-run.tsx 참고; 프로젝트는 앱 안에서 고른다). .app 격자 없음. 입력값 비움. 설명 문장 없음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* 장별: 배치와 SVG 크기만 */
.corner{position:fixed;top:12px;right:12px;display:flex;gap:4px;z-index:3}
.corner button{font-size:11px;color:var(--mute);height:24px;min-width:24px;padding:0 6px;border-radius:3px;display:inline-grid;place-items:center}
.corner button:hover{background:var(--panel);color:var(--fg)}
.corner .moon{display:none}
[data-theme=dark] .corner .sun{display:none}
[data-theme=dark] .corner .moon{display:block}
.signin .head{display:flex;align-items:center;gap:8px}
.signin .head .step{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.signin .card.next{align-self:center}
.signin .card .btn.new{justify-content:flex-start}
</style>
</head>
<body class="site">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><path d="M2.5 20 6.5 9l4 11M4 16.5h5"/><path d="M12.5 4.5h5c0 4.6-1.9 8.1-5 10.5"/><path d="M20.5 3v13M20.5 9.5h2"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<div class="corner">
  <button type="button" data-lang-toggle aria-pressed="false" title="언어 · EN" data-en-title="Language · 한" aria-label="언어" data-en-label="Language"><svg class="i xs"><use href="#i-lang"/></svg></button>
  <button type="button" data-theme-toggle title="밝게 / 어둡게" data-en-title="Light / Dark"><svg class="i xs sun"><use href="#i-sun"/></svg><svg class="i xs moon"><use href="#i-moon"/></svg></button>
</div>

<main class="signin">
  <form class="card" action="01-start.html" method="get" aria-label="로그인">
    <div class="head"><span class="mark">VIDE</span></div>
    <label><span data-en="Email">이메일</span><input type="email" name="email" autocomplete="email" spellcheck="false"></label>
    <label><span data-en="Password">비밀번호</span><input type="password" name="password" autocomplete="current-password"></label>
    <a class="btn primary" href="01-start.html" data-en="Sign in">로그인</a>
    <div class="links"><a href="#" data-en="Sign up">가입</a><a href="#" data-en="Reset">비밀번호 찾기</a></div>
    <div class="rule"></div>
    <div class="links"><a href="#">AccountSwitch</a></div>
  </form>

</main>

<nav class="demo-nav" aria-label="데모 넘기기"><a class="prev off" href="#" title="이전">‹</a><b>1 / 13</b><a class="next" href="01-start.html" title="다음">›</a></nav>
<script src="app.js"></script>
</body>
</html>
