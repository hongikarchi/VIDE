<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="VIDE — Setup · Programs">VIDE — 설정 · 프로그램</title>
<!-- VIDE Next 목업 v10 · 15 첫 실행 설정 ② 프로그램(가운데, Aside 첫 화면 꼴). 큰 카드 6(140×120): Rhino 8 · ZWCAD 2023 = ✓ 감지(켬 가능, 누르면 켬/끔; 확장 있음 hosts/rhino · hosts/zwcad) / AutoCAD · Revit · SketchUp · Blender = 점선 + 지원 예정(.dim, 고를 수 없음). 켠 카드만 아래 줄 '확장 [설치]' / '확장 ✓ 설치됨'. 진행 점 3 + [이전][다음] → 16. 설명 문장 없음. 합성 데이터. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* 장별: 배치만 */
.corner{position:fixed;top:12px;right:12px;display:flex;gap:4px;z-index:3}
.corner button{font-size:11px;color:var(--mute);height:24px;min-width:24px;padding:0 6px;border-radius:3px;display:inline-grid;place-items:center}
.corner button:hover{background:var(--panel);color:var(--fg)}
.corner .moon{display:none}
[data-theme=dark] .corner .sun{display:none}
[data-theme=dark] .corner .moon{display:block}
.bigcards.sm{max-width:460px}
.center .status .row b{font-weight:500;color:var(--fg)}
.center .status .row[hidden]{display:none}
</style>
</head>
<body class="site">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><path d="M2.5 20 6.5 9l4 11M4 16.5h5"/><path d="M12.5 4.5h5c0 4.6-1.9 8.1-5 10.5"/><path d="M20.5 3v13M20.5 9.5h2"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12 20 7.5M12 12v9M12 12 4 7.5"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 11h8v9M11 4v4M15 11h6"/></symbol>
  <symbol id="i-struct" viewBox="0 0 24 24"><path d="M4 20h16M6 20V9l6-5 6 5v11M10 20v-6h4v6"/></symbol>
  <symbol id="i-sphere" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12c0 2.2 3.6 4 8 4s8-1.8 8-4"/></symbol>
</svg>

<div class="corner">
  <button type="button" data-lang-toggle aria-pressed="false" title="언어 · EN" data-en-title="Language · 한" aria-label="언어" data-en-label="Language"><svg class="i xs"><use href="#i-lang"/></svg></button>
  <button type="button" data-theme-toggle title="밝게 / 어둡게" data-en-title="Light / Dark"><svg class="i xs sun"><use href="#i-sun"/></svg><svg class="i xs moon"><use href="#i-moon"/></svg></button>
</div>

<main class="center">
  <span class="wm">VIDE</span>
  <h1 data-en="Programs">프로그램</h1>
  <div class="bigcards sm" role="group" aria-label="프로그램" data-en-label="Programs">
    <button type="button" class="bigcard" aria-pressed="true" data-host="rhino"><span class="ck">✓</span><svg class="i"><use href="#i-cube"/></svg><span class="t">Rhino 8</span><span class="s">✓ <bdi data-en="Found">감지</bdi></span></button>
    <button type="button" class="bigcard" aria-pressed="true" data-host="zwcad"><span class="ck">✓</span><svg class="i"><use href="#i-plan"/></svg><span class="t">ZWCAD 2023</span><span class="s">✓ <bdi data-en="Found">감지</bdi></span></button>
    <div class="bigcard dim" aria-disabled="true"><svg class="i"><use href="#i-plan"/></svg><span class="t">AutoCAD</span><span class="s" data-en="Soon">지원 예정</span></div>
    <div class="bigcard dim" aria-disabled="true"><svg class="i"><use href="#i-struct"/></svg><span class="t">Revit</span><span class="s" data-en="Soon">지원 예정</span></div>
    <div class="bigcard dim" aria-disabled="true"><svg class="i"><use href="#i-cube"/></svg><span class="t">SketchUp</span><span class="s" data-en="Soon">지원 예정</span></div>
    <div class="bigcard dim" aria-disabled="true"><svg class="i"><use href="#i-sphere"/></svg><span class="t">Blender</span><span class="s" data-en="Soon">지원 예정</span></div>
  </div>
  <div class="status">
    <div class="row" data-host="rhino"><b>Rhino 8</b><span data-en="Extension">확장</span><button type="button" class="btn" data-install data-en="Install">설치</button></div>
    <div class="row" data-host="zwcad"><b>ZWCAD 2023</b><span data-en="Extension">확장</span><span>✓ <bdi data-en="Installed">설치됨</bdi></span></div>
  </div>
  <div class="dots" aria-label="2 / 3"><i></i><i class="on"></i><i></i></div>
  <div class="foot"><a class="btn" href="14-setup.html" data-en="Back">이전</a><a class="btn primary" href="16-setup-style.html" data-en="Next">다음</a></div>
</main>

<nav class="demo-nav" aria-label="데모 넘기기"><a class="prev" href="14-setup.html" title="이전">‹</a><b>3 / 16</b><a class="next" href="16-setup-style.html" title="다음">›</a></nav>
<script src="app.js"></script>
<script>
/* 15: 감지된 카드 켬/끔 → 그 확장 줄 보임/숨김 · [설치] → ✓ 설치됨 */
(function () {
  var st = document.querySelector('.center .status');
  document.querySelector('.bigcards').addEventListener('click', function (e) {
    var b = e.target.closest('button.bigcard'); if (!b) return;
    var on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on));
    st.querySelector('.row[data-host="' + b.dataset.host + '"]').hidden = !on;
  });
  st.addEventListener('click', function (e) {
    var b = e.target.closest('[data-install]'); if (!b) return;
    var en = document.documentElement.lang === 'en', s = document.createElement('span');
    s.innerHTML = '✓ <bdi data-ko="설치됨" data-en="Installed">' + (en ? 'Installed' : '설치됨') + '</bdi>'; b.replaceWith(s);
  });
})();
</script>
</body>
</html>
