<script src="app.js"></script>
<script>
/* 15: 카드를 누르면 단추 없이 그 자리에서 확장 처리 — ⟳ 설치 → ✓ 설치됨. 다시 누르면 끔 */
(function () {
  var en = function () { return document.documentElement.lang === 'en'; };
  var w = function (ko, e) { return '<bdi data-ko="' + ko + '" data-en="' + e + '">' + (en() ? e : ko) + '</bdi>'; };
  document.querySelector('.bigcards').addEventListener('click', function (e) {
    var card = e.target.closest('.bigcard'); if (!card || card.classList.contains('dim')) return;
    var act = card.querySelector('.act');
    var on = card.getAttribute('aria-pressed') !== 'true';
    card.setAttribute('aria-pressed', String(on)); act.hidden = !on;
    if (!on) { act.innerHTML = ''; return; }
    act.innerHTML = '<span class="busy"><span class="spin">⟳</span> ' + w('설치', 'Installing') + '</span>';
    setTimeout(function () { if (!act.hidden) act.innerHTML = '<span class="ok">✓ ' + w('설치됨', 'Installed') + '</span>'; }, 900);
  });
})();
</script>
