<script src="app.js"></script>
<script>
/* 15: 지원 호스트 카드 켜고 끔(카드 누르기 = .ck aria-pressed ↔ .card.on). [설치]는 켠 카드에만(app.css) */
(function () {
  [].forEach.call(document.querySelectorAll('.setup .card:not(.dim)'), function (c) {
    var ck = c.querySelector('.ck');
    c.addEventListener('click', function (e) { if (e.target.closest('.row .btn')) return; var on = !c.classList.contains('on'); c.classList.toggle('on', on); ck.setAttribute('aria-pressed', String(on)); });
  });
})();
</script>
