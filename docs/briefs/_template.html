<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브리프 제목</title>
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--mute:#6b6b66;--line:#e2e2dd;--card:#fff;--rec:#1f6f5f;--rec-bg:#e6f3ef;--on:#1c1c1a;--on-fg:#fff;--ok:#2e8b57;--warn:#c98a00;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mute:#9a9a93;--line:#2c2c29;--card:#1f1f1c;--rec:#7fcbb6;--rec-bg:#1d2e2a;--on:#ecebe6;--on-fg:#161614}}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px 200px;background:var(--bg);color:var(--fg);font:16px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:720px;margin:0 auto}
h1{font-size:26px;line-height:1.3;margin:0 0 6px}
.meta{color:var(--mute);font-size:14px;margin:0 0 14px}
.meta a{color:inherit}
.why{font-size:17px;margin:0 0 28px;padding:14px 16px;border-left:3px solid var(--rec);background:var(--card);border-radius:0 8px 8px 0}
.status{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);vertical-align:middle}
ol.list{list-style:none;padding:0;margin:0;display:grid;gap:18px}
li.d,li.r{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px}
h2{font-size:18px;margin:0 0 12px;line-height:1.4}
.id{display:inline-block;min-width:34px;margin-right:8px;padding:0 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--mute);text-align:center;vertical-align:2px}
.options{display:grid;gap:8px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.opt b{font-weight:600}
.opt small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.opt.rec{border-color:var(--rec);background:var(--rec-bg)}
.opt.rec b::after{content:"추천";margin-left:8px;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--rec);color:#fff;font-weight:600;vertical-align:2px}
.opt.on{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.opt.on small{color:inherit;opacity:.8}
.opt.on.rec b::after{background:var(--on-fg);color:var(--on)}
.line{margin:4px 0;font-size:15px}
.line b{color:var(--mute);font-weight:600;margin-right:6px}
details{margin-top:8px;font-size:14px;color:var(--mute)}
summary{cursor:pointer}
details a{color:inherit}
.r .verdict{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.reply{position:sticky;bottom:0;margin-top:28px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 -6px 24px rgba(0,0,0,.06)}
.reply .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.btn.primary{background:var(--on);color:var(--on-fg);border-color:var(--on)}
textarea{width:100%;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px;resize:vertical;min-height:40px}
#out{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:14px;white-space:pre-wrap;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>브리프 제목 (결정 N건)</h1>
<p class="meta">2026-00-00 · <span class="status">결정 대기</span> · 근거: <a href="../../human/docs/research/RESEARCH-00-slug.html">RESEARCH-00</a></p>
<p class="why">왜 지금 정해야 하는지 한 문장.</p>

<ol class="list">

<li class="d" data-id="D1">
  <h2><span class="id">D1</span>질문 한 문장?</h2>
  <div class="options">
    <button class="opt rec" data-v="①"><b>① 추천 선택지</b><small>40자 안의 설명</small></button>
    <button class="opt" data-v="②"><b>② 다른 선택지</b><small>설명</small></button>
    <button class="opt" data-v="③"><b>③ 또 다른 선택지</b><small>설명</small></button>
  </div>
  <p class="line"><b>이유</b>추천하는 이유 한 줄.</p>
  <p class="line"><b>틀리면</b>잘못 골랐을 때 치르는 비용 한 줄.</p>
  <details><summary>더 보기</summary>
    <p>근거 두세 줄. 정본 문서 링크.</p>
  </details>
</li>

<li class="r">
  <h2><span class="id">R1</span><span class="verdict ok"></span>결과 카드 제목 — 한 줄 결론</h2>
  <p class="line">상태 색: 초록 통과 · 노랑 주의 · 빨강 실패.</p>
  <details><summary>더 보기</summary><p>수치·근거는 여기에.</p></details>
</li>

</ol>

<div class="reply">
  <div class="row">
    <button class="btn" id="all">추천 전부</button>
    <button class="btn primary" id="copy">답장 복사</button>
    <span id="msg" style="color:var(--mute);font-size:14px"></span>
  </div>
  <textarea id="memo" placeholder="메모(선택)"></textarea>
  <pre id="out">선택지를 누르면 여기에 답장이 만들어집니다.</pre>
</div>
</main>
<script>
(function(){
  var ds=[].slice.call(document.querySelectorAll('li.d'));
  function render(){
    var parts=[];
    ds.forEach(function(d){var on=d.querySelector('.opt.on');if(on)parts.push(d.dataset.id+' '+on.dataset.v);});
    var memo=document.getElementById('memo').value.trim();
    var t=parts.join(' / ')+(memo?' · 메모: '+memo:'');
    document.getElementById('out').textContent=t||'선택지를 누르면 여기에 답장이 만들어집니다.';
    return t;
  }
  ds.forEach(function(d){
    [].slice.call(d.querySelectorAll('.opt')).forEach(function(b){
      b.addEventListener('click',function(){
        var was=b.classList.contains('on');
        d.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on');});
        if(!was)b.classList.add('on');
        render();
      });
    });
  });
  document.getElementById('all').addEventListener('click',function(){
    ds.forEach(function(d){d.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on');});var r=d.querySelector('.opt.rec');if(r)r.classList.add('on');});
    render();
  });
  document.getElementById('memo').addEventListener('input',render);
  document.getElementById('copy').addEventListener('click',function(){
    var t=render(),m=document.getElementById('msg');
    if(!t){m.textContent='먼저 선택지를 고르세요.';return;}
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){m.textContent='복사됨. 채팅에 붙여 넣으세요.';},function(){m.textContent='아래 문장을 직접 복사하세요.';});
  });
})();
</script>
</body>
</html>
