<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDE · 작업 공간</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body>

<div class="mobile-tabs"><button data-mobile="model" aria-pressed="true">모델</button><button data-mobile="input" aria-pressed="false">대화</button></div>
<main><aside id="left"><div class="project-heading"><strong class="brand">V<span>.</span></strong><strong>매스 스터디</strong></div><p class="caption">연결 문서</p><details class="document" id="document-tree"><summary>매스 스터디.3dm</summary><small>Rhino · 예제</small><details id="object-tree"><summary>객체</summary><div id="objects"></div></details></details><details class="nav-section"><summary>작업</summary><div id="task-list"><small>아직 요청이 없습니다.</small></div></details><details class="nav-section"><summary>참고 자료</summary><div id="reference-list"><small>첨부한 파일이 없습니다.</small></div></details><details class="preview-info"><summary>미리보기</summary><p>합성 모델 · AI/호스트 미연결.<br>모델 목록과 effort는 화면 검수용 예시입니다. 전송은 로컬 요청 카드만 만들며 AI 응답이나 기하 변경을 생성하지 않습니다.</p></details></aside>
<section class="workspace"><button class="edge-toggle edge-left" id="toggle-left" aria-label="문서 패널 접기/펼치기" aria-expanded="true" title="문서 · Alt+Shift+L">‹</button><button class="edge-toggle edge-right" id="toggle-right" aria-label="대화 패널 접기/펼치기" aria-expanded="true" title="대화 · Alt+Shift+R">›</button><div class="toolbar"><div class="tools" aria-label="모델 도구"><button data-tool="select" aria-pressed="true">선택</button><button data-tool="pin" aria-pressed="false" title="모델에서 객체를 눌러 입력에 첨부">핀</button><button data-tool="sketch" aria-pressed="false">스케치</button></div><select id="projection" aria-label="투영"><option value="axon">3D</option><option value="plan">위</option><option value="front">앞</option><option value="side">옆</option></select><button id="fit-view" title="모델 전체 보기">전체 보기</button><span id="selection"></span></div>
<div id="sketch-tools" hidden><select id="plane" aria-label="작업 평면"><option>XY</option><option>XZ</option><option>YZ</option></select><select id="line-role" aria-label="선 역할"><option value="reference">참고</option><option value="boundary">경계</option><option value="path">경로</option><option value="direction">방향</option></select><button id="undo-point" title="마지막 점 지우기">↶</button><button id="finish-sketch">입력에 첨부</button><button id="cancel-sketch">취소</button><span>평면 원점 0 · m</span></div>
<div id="canvas"></div><p id="tool-hint"></p></section>
<aside id="right"><div class="chat-heading"><h2>새 대화</h2><details id="draft-menu"><summary aria-label="초안 메뉴">···</summary><button id="save">초안 저장</button><button id="load">불러오기</button></details></div><div id="conversation" aria-label="대화" aria-live="polite"><div class="chat-empty">V<span>.</span></div></div>
<div class="composer-wrap"><div class="composer"><div id="context" aria-label="첨부한 문맥"></div><label class="sr-only" for="body">메시지</label><textarea id="body" rows="3" placeholder="무엇을 도와드릴까요? · @ 대상"></textarea><div class="compose-actions"><details id="attach-menu"><summary aria-label="참조 추가" title="참조 추가">＋</summary><div class="menu"><button id="pin">선택한 객체 첨부</button><button id="draw">스케치 그리기</button><button id="attach-file">파일 첨부</button></div></details><input id="files" type="file" multiple hidden><span id="saved"></span><button id="request" class="send" aria-label="메시지 보내기" title="보내기 · Ctrl+Enter">↑</button></div></div>
<div class="composer-settings"><select id="permission" aria-label="Permission" title="Permission"><option value="review">검토만</option><option value="candidate">후보 작업 허용</option></select><select id="model" aria-label="모델" title="모델 · 예시 목록"></select><select id="effort" aria-label="Effort" title="Effort"></select></div><p id="validation" role="status"></p>
</div></aside></main><div id="message" class="toast" role="status" hidden></div>
</body></html>
